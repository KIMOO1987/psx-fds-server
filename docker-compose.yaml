version: '3.8'

services:
  psx-fds-server:
    build: .
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-Kaleem93527@}
      - SECRET_KEY=${SECRET_KEY:-N6xR9wK2mP5qT8vB1zY4cC7fJ0gL3kS5}
      - DATA_DIR=/app/data
    volumes:
      - psx_data:/app/data

volumes:
  psx_data:
    driver: local
